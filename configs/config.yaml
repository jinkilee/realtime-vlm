# realtime-vlm configuration (single source of truth for serving + backend + examples)
# Env overrides: SERVING -> serving.backend, MODEL_ID -> serving.model_id

serving:
  backend: vllm                     # vllm | triton (triton: P6)
  # Local model directory (plain files, no HF cache layout). Relative paths are resolved
  # from the project root (/workspace in the container). A HF repo id also works if offline=false.
  # P1 eval (examples/eval_strategies.py): 4B-FP8 two_stage F1 0.92 / FP 0 vs 2B best F1 ~0.92 only
  # with a fragile threshold. 2B alternative: model_files/Qwen3-VL-2B-Instruct
  # (with 2B use gpu_memory_utilization 0.78, max_model_len 8192, judge_threshold ~0.9).
  model_id: model_files/Qwen3-VL-4B-Instruct-FP8
  offline: true                     # HF_HUB_OFFLINE=1: never download / contact the hub
  served_model_name: vlm
  host: serving                     # docker-compose service name (backend -> serving)
  port: 9000
  gpu_memory_utilization: 0.85      # 4B-FP8 weights take 5.85 GiB; Windows keeps ~1 GiB of the 8 GiB
  max_model_len: 2048               # KV cache ~3.2k tokens total; one 4-frame request is ~0.5k tokens
  max_num_seqs: 4
  max_images_per_request: 4         # upper bound of inference.num_frames
  # priority: grounding requests (bbox, ~44 decode tokens) are served before judge requests
  # (1 token, prefill-heavy); otherwise 4 streams of judges starve grounding (p90 4-5 s -> see P2 notes)
  scheduling_policy: priority       # fcfs | priority
  extra_args: ""                    # appended to `vllm serve` as-is
  extra_env: {}                     # extra environment variables for `vllm serve` (e.g. {VLLM_WSL2_ENABLE_PIN_MEMORY: "1"})

preprocess:
  # Long edge (px) each frame is resized to before being sent to the server.
  # The same value is used on the server side:
  #   - vLLM memory profiling size (max_side x max_side)
  #   - hard cap on image pixels (max_side^2) in the HF image processor,
  #     so an oversized image can never exceed the profiled budget.
  # Image tokens ~= (h/32) * (w/32): 448x252 -> ~112 tokens per frame.
  # Changing this requires a container restart (server-side values).
  max_side: 448
  jpeg_quality: 85

inference:
  # two_stage: N frames -> yes/no judge (score = P(yes)); if >= judge_threshold, ground boxes
  #            on the last frame. multi_image (boxes from N frames in one call) gave broken
  #            coordinates; single_frame boxes every person regardless of the query.
  strategy: two_stage               # multi_image | two_stage | single_frame
  judge_threshold: 0.5              # 4B: negatives scored <= 0.04, positives mostly > 0.9
  num_frames: 4                     # frames per request (1 = single frame)
  window_sec: 2.0                   # time span the frames are sampled from
  max_tokens: 512
  temperature: 0.0
  timeout_sec: 30

stream:
  max_streams: 4
  buffer_fps: 10                    # frames/s kept in the ring buffer
  buffer_max_side: 960              # ring buffer frame size (inference resizes to preprocess.max_side;
                                    # this size is what event snapshots get). ~60 MB/stream at 16:9
  buffer_sec: 4.0                   # ring buffer length; must be >= any stream's window_sec
  # min period between request starts per stream (0 = back-to-back). 4 streams, RTX 4060 + 4B-FP8:
  #   250 ms -> detection (judge+bbox) p90 ~4 s, 500 -> 2.5-4 s, 1000 -> ~1.7 s (GPU saturated in all)
  interval_ms: 1000
  mjpeg_fps: 15                     # live preview frame rate per client
  mjpeg_quality: 80
  mjpeg_max_side: 960               # live preview long edge (px)
  reconnect_max_sec: 10             # RTSP reconnect backoff ceiling

events:
  dir: data/events                  # events.jsonl + <YYYYMMDD>/<id>.jpg snapshots (relative to project root)
  cooldown_sec: 5.0                 # detections within this gap on the same stream merge into one event
  max_in_memory: 500

backend:
  port: 8000                        # inside the compose network (published as 127.0.0.1:8001)
  reload: true                      # uvicorn --reload on backend/app or configs/ changes (dev; source is mounted)

profiling:
  # Stage timing (decode / sample / preprocess / HTTP / publish / MJPEG), GET /api/profile.
  # Can also be toggled at runtime: POST /api/profile?enabled=true (resets the counters).
  enabled: false
