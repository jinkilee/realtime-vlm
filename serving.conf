; supervisord program: entrypoint.sh (config load -> serving backend -> app)
; logs land in /var/log/supervisor, mounted to ./logs by run_docker.sh
[program:serving]
command=bash /workspace/entrypoint.sh
directory=/workspace
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/serving.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/serving.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
